name: Stabæk Dypsøk (sky)

# Stort dypsøk – alle kilder × ~190 søkeord + eBay-varianter.
# Kjører hver 3. time, i tillegg til det vanlige 10-min-søket.
on:
  schedule:
    # Monitor-jobben kjører nå en 55-min løkke nesten hele timen (samme
    # concurrency-gruppe), så dypsøket flyttet til ÉN gang daglig (03:30 UTC)
    # for å unngå at de blokkerer hverandre. Den brede keyword-dekningen
    # (~190 søk) er supplement; selve freshness dekkes av time-løkka.
    - cron: "30 3 * * *"
  workflow_dispatch:

# Samme gruppe som vanlig søk – deler dedup-cache, må aldri overlappe.
concurrency:
  group: stabek-shared-db
  cancel-in-progress: false

jobs:
  deepscan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Gjenopprett database-cache
        uses: actions/cache@v4
        with:
          path: |
            seen_ads.jsonl
            image_cache_v2.db
            health_state.json
            heartbeat_state.json
            stats.json
          key: stabek-db-${{ github.run_id }}
          restore-keys: |
            stabek-db-
      - name: Kjør dypsøk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp config.template.yaml config.yaml
          python ultra_scan.py
