name: Stabæk Nattlig selvrevisjon (kl 02:00)

# Går over ALT hver natt kl 02:00 (Oslo): alle kilder svarer? system OK?
# gjennomgang av alt sendt siste døgn. Sender én rapport til Telegram.
on:
  schedule:
    - cron: "0 0 * * *"     # 00:00 UTC = 02:00 Oslo (sommertid)
  workflow_dispatch:

# Restore-only (skriver aldri cache), så ingen concurrency-konflikt med søket.
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      # Revisjonen trenger bare sendt-loggen (egen cache) – ikke hovedbasen.
      - name: Hent sendt-logg
        uses: actions/cache/restore@v4
        with:
          path: sent_log.jsonl
          key: sent-log-x
          restore-keys: |
            sent-log-
      - name: Kjør nattlig revisjon
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp config.template.yaml config.yaml
          python nightly_audit.py
