name: Stabæk Time-rapport (kl :45)

# Sender statistikk til Telegram hvert hele time, minutt 45.
on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  actions: read     # for å telle antall kjøringer (runder) via APIet
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer (lett)
        run: pip install pyyaml
      # Kun LESE cachen (restore) – skriver aldri, så ingen race med søke-jobbene.
      # VIKTIG: path-lista MÅ være IDENTISK med monitor.yml, ellers får cachen
      # en annen versjon-hash og restore-keys finner den ikke («Cache not found»
      # selv om den finnes). Dette var grunnen til at rapporten viste frø-tall.
      - name: Hent stats-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_ads.jsonl
            image_cache_v2.db
            health_state.json
            heartbeat_state.json
            stats.json
            deep_state.json
            sent_log.jsonl
          key: stabek-db-x   # treffer aldri eksakt → bruker restore-keys
          restore-keys: |
            stabek-db-
      - name: Send time-rapport
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp config.template.yaml config.yaml
          python hourly_stats.py
