name: Stabæk Monitor (sky)

# Kjører i GitHubs sky – uavhengig av Halvors Mac.
# Cron hvert 15. minutt (GitHub kan forsinke noen min under last).
on:
  schedule:
    # GitHub struper hyppig cron (*/10 ga i praksis bare ~9 runder/døgn).
    # Løsning: hver jobb kjører en intern løkke i ~5 TIMER (se --loop-minutes),
    # og time-cronen + concurrency-køen sørger for uavbrutt overtakelse: når
    # en 5-timers jobb slutter, starter den ventende time-fyringen umiddelbart.
    # = tilnærmet kontinuerlig drift uten å stole på cron-frekvensen.
    # :05 unngår GitHubs last på toppen av timen.
    - cron: "5 * * * *"
  workflow_dispatch:   # lar deg kjøre manuelt fra Actions-fanen
    inputs:
      loop_minutes:
        description: "Hvor mange minutter løkka skal kjøre (lav verdi = rask test)"
        default: "300"
        required: false

# Hindrer at to kjøringer overlapper (ville gitt dobbel-varsler)
# Samme gruppe som dypsøket – de deler dedup-cache og må ALDRI kjøre
# samtidig (ellers mister de hverandres «sett»-data = duplikat-varsler).
concurrency:
  group: stabek-shared-db
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 5-timers løkke + margin (GitHub hard-grense er 6t)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Persistér dedup-databasen mellom kjøringer (ellers re-varsles alt).
      # Unik key per kjøring + restore-keys henter siste lagrede.
      - name: Gjenopprett database-cache
        uses: actions/cache@v4
        with:
          path: |
            seen_ads.jsonl
            image_cache_v2.db
            health_state.json
            heartbeat_state.json
            stats.json
            deep_state.json
          key: stabek-db-${{ github.run_id }}
          restore-keys: |
            stabek-db-

      # sent_log.jsonl i EGEN cache (ikke rør hoved-versjon-hashen over –
      # ellers mister vi hele dedup-basen). Nattlig revisjon leser denne.
      - name: Persistér sendt-logg
        uses: actions/cache@v4
        with:
          path: sent_log.jsonl
          key: sent-log-${{ github.run_id }}
          restore-keys: |
            sent-log-

      - name: Kjør 5-timers løkke
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp config.template.yaml config.yaml
          python monitor.py --loop-minutes ${{ github.event.inputs.loop_minutes || '300' }}
